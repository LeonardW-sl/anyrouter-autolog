name: Schedule probe
on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Record scheduler event
        run: |
          echo "event=${{ github.event_name }}"
          echo "scheduled=${{ github.event.schedule }}"
          date -u '+utc=%Y-%m-%dT%H:%M:%SZ'
