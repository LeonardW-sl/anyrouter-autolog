# Fork deployment activation
name: AnyRouter 自动签到
on:
  schedule:
    - cron: '0 9,23 * * *'
  workflow_dispatch:
    inputs:
      only_providers:
        description: '只跑这些站点（逗号分隔，如 agentrouter）。留空跑全部'
        required: false
        default: ''
      probe_waf:
        description: '只跑 WAF 诊断，不签到（不带凭据）'
        type: boolean
        required: false
        default: false

jobs:
  checkin:
    runs-on: windows-2025
    environment: production
    env:
      PYTHONIOENCODING: utf-8
    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 缓存 UV 依赖
      uses: actions/cache@v4
      id: uv-cache
      with:
        path: |
          ~/.cache/uv
          .venv
        key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml', 'uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: 安装依赖
      if: steps.uv-cache.outputs.cache-hit != 'true'
      run: |
        echo "缓存未命中，开始安装项目依赖..."
        uv sync
        echo "✅ 环境初始化完成"

    - name: 获取 Playwright 版本
      id: playwright-version
      run: |
        $version = uv run python -c "import importlib.metadata; print(importlib.metadata.version('playwright'))"
        echo "version=$version" >> $env:GITHUB_OUTPUT
        echo "Playwright version: $version"

    - name: 缓存 Playwright 浏览器
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~\AppData\Local\ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: 安装 Playwright 浏览器
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: |
        echo "缓存未命中，开始安装 Playwright 浏览器..."
        uv run playwright install chromium --with-deps

    - name: 恢复余额历史缓存
      uses: actions/cache@v4
      with:
        path: balance_hash.txt
        key: balance-hash-${{ github.sha }}
        restore-keys: |
          balance-hash-

    # 定时任务准点触发太规律，随机延迟一下；手动触发不延迟
    - name: 随机延迟
      if: github.event_name == 'schedule'
      run: |
        $delay = Get-Random -Minimum 0 -Maximum 900
        Write-Host "随机延迟 $delay 秒后开始"
        Start-Sleep -Seconds $delay

    # 诊断路径：不读任何 secret，不触发签到，只看 WAF 拦在哪一层
    - name: WAF 诊断
      if: inputs.probe_waf
      run: |
        Write-Host "出口 IP: $((Invoke-WebRequest -Uri 'https://api.ipify.org').Content)"
        uv run python tools/waf_probe.py

    - name: 执行签到
      if: ${{ !inputs.probe_waf }}
      env:
        ANYROUTER_ACCOUNTS: ${{ secrets.ANYROUTER_ACCOUNTS }}
        PROVIDERS: ${{ secrets.PROVIDERS }}
        GH_SESSION_1: ${{ secrets.GH_SESSION_1 }}
        GH_SESSION_2: ${{ secrets.GH_SESSION_2 }}
        LINUXDO_SESSION_2: ${{ secrets.LINUXDO_SESSION_2 }}
        # agentrouter 密码登录：比重放 OAuth 稳，不受上游 Cloudflare 挑战影响
        AG1_USERNAME: ${{ secrets.AG1_USERNAME }}
        AG1_PASSWORD: ${{ secrets.AG1_PASSWORD }}
        AG2_USERNAME: ${{ secrets.AG2_USERNAME }}
        AG2_PASSWORD: ${{ secrets.AG2_PASSWORD }}
        CHECKIN_USER_AGENT: ${{ vars.CHECKIN_USER_AGENT }}
        ACCOUNT_INTERVAL_SECONDS: ${{ vars.ACCOUNT_INTERVAL_SECONDS }}
        CHECKIN_ONLY_PROVIDERS: ${{ inputs.only_providers }}
        DINGDING_WEBHOOK: ${{ secrets.DINGDING_WEBHOOK }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        EMAIL_TO: ${{ secrets.EMAIL_TO }}
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        CUSTOM_SMTP_SERVER: ${{ secrets.CUSTOM_SMTP_SERVER }}
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        SERVERPUSHKEY: ${{ secrets.SERVERPUSHKEY }}
        FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        FEISHU_WEBHOOK_ANYROUTER: ${{ secrets.FEISHU_WEBHOOK_ANYROUTER }}
        FEISHU_WEBHOOK_AGENTROUTER: ${{ secrets.FEISHU_WEBHOOK_AGENTROUTER }}
        WEIXIN_WEBHOOK: ${{ secrets.WEIXIN_WEBHOOK }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
        GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
        GOTIFY_PRIORITY: ${{ secrets.GOTIFY_PRIORITY }}
        BARK_KEY: ${{ secrets.BARK_KEY }}
        BARK_SERVER: ${{ secrets.BARK_SERVER }}
      run: |
        uv run checkin.py

    - name: 执行结果
      if: always()
      run: |
        echo "签到任务执行完成"
        echo "时间: $(Get-Date)"
